---
layout: default
---

<div class="learning-layout">
    <aside class="learning-sidebar">
        <button class="sidebar-toggle" aria-expanded="false" aria-controls="sidebar-nav">
            <span class="sidebar-toggle-label">📚 Topics</span>
            <span class="sidebar-toggle-icon">▾</span>
        </button>
        <nav id="sidebar-nav" class="sidebar-nav">
            <a href="{{ '/learning/programming-language/' | relative_url }}"
                class="{% if page.url contains '/programming-language/' %}active{% endif %}">Programming Languages</a>
            <a href="{{ '/learning/dsa/' | relative_url }}"
                class="{% if page.url contains '/dsa/' %}active{% endif %}">DSA</a>
            <a href="{{ '/learning/system-design/' | relative_url }}"
                class="{% if page.url contains '/system-design/' %}active{% endif %}">System Design</a>
            <a href="{{ '/learning/oop/' | relative_url }}"
                class="{% if page.url contains '/oop/' %}active{% endif %}">OOP</a>
            <a href="{{ '/learning/operating-systems/' | relative_url }}"
                class="{% if page.url contains '/operating-systems/' %}active{% endif %}">Operating Systems</a>
            <a href="{{ '/learning/networking/' | relative_url }}"
                class="{% if page.url contains '/networking/' %}active{% endif %}">Networking</a>
            <a href="{{ '/learning/4g-5g/' | relative_url }}"
                class="{% if page.url contains '/4g-5g/' %}active{% endif %}">4G/5G Networks</a>
            <a href="{{ '/learning/competitive-programming/' | relative_url }}"
                class="{% if page.url contains '/competitive-programming/' %}active{% endif %}">Competitive Programming</a>
            <a href="{{ '/learning/ai-ml/' | relative_url }}"
                class="{% if page.url contains '/ai-ml/' %}active{% endif %}">AI & ML</a>
            <a href="{{ '/learning/data-plane/' | relative_url }}"
                class="{% if page.url contains '/data-plane/' %}active{% endif %}">Data Plane</a>
            <a href="{{ '/learning/finance/' | relative_url }}"
                class="{% if page.url contains '/finance/' %}active{% endif %}">Finance</a>
        </nav>
    </aside>

    <div class="learning-content">
        <div class="breadcrumbs">
            <a href="{{ '/learning/' | relative_url }}">Learning Portal</a> &raquo; <span>{{ page.title }}</span>
        </div>

        {{ content }}
    </div>
</div>

<script>
(function() {
    var toggle = document.querySelector('.sidebar-toggle');
    var nav = document.getElementById('sidebar-nav');
    if (!toggle || !nav) return;

    function isMobile() { return window.innerWidth <= 768; }

    function applyState() {
        if (!isMobile()) {
            nav.style.display = '';
            nav.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'true');
        }
    }

    toggle.addEventListener('click', function() {
        if (!isMobile()) return;
        var open = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
        toggle.querySelector('.sidebar-toggle-icon').textContent = open ? '▴' : '▾';
    });

    window.addEventListener('resize', applyState);
    applyState();
})();
</script>
