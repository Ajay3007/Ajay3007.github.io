title: ajdevhub
description: Projects and Learning Resources
author: Ajay Kumar Gupt
baseurl: ""
url: "https://ajay3007.github.io"

# Social / SEO
twitter_username: ajay3007
github_username: Ajay3007
og_image: /assets/images/og-default.png # default Open Graph image

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    block:
      line_numbers: false

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:slug/
  learning:
    output: true
    permalink: /learning/:path/
  editorials:
    output: true
    permalink: /editorials/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing (kept in the repo, but NOT published to the built site)
exclude:
  - scripts/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .venv/
  # Video-generation tooling (AxioByte manim project) — repo content, not a website section
  - _learning/manim-scripts/
  # Internal planning / maintenance docs — not public pages
  - CLAUDE.md
  - prompt.md
  - redesign-prompt.md
  - AUDIT_REPORT.md
  - LINK_CONVERSION_GUIDE.md
  - SITE_MAINTENANCE_LOG.md
  - RELEASE_NOTES_v1.0.0.md
  - RELEASE_v1.1.0.md
  - RELEASE_v1.2.0.md
