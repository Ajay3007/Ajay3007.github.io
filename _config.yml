title: ajdevhub
description: Projects and Learning Resources
author: Ajay Kumar Gupt
baseurl: ""
url: "https://ajay3007.github.io"

# Build settings
markdown: kramdown
theme: minima

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:slug/

# Plugins
plugins:
  - jekyll-feed


# _config.yml (additions)
permalink: pretty
timezone: Asia/Kolkata

# Keep your existing config as-is, then add:
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

# Optional: better code blocks
kramdown:
  input: GFM
  syntax_highlighter: rouge
