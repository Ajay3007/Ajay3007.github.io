backend:
  name: git-gateway
  branch: master
  site_domain: ajdevhub.netlify.app
  squash_merges: true
  commit_messages:
    create: 'feat({{collection}}): generate new content "{{slug}}"'
    update: 'fix({{collection}}): update content "{{slug}}"'
    delete: 'refactor({{collection}}): remove content "{{slug}}"'
    uploadMedia: 'chore(media): upload media "{{path}}"'
    deleteMedia: 'chore(media): delete media "{{path}}"'

# Optional: Disable local Git workflow if deploying solely via GitHub
local_backend: true

media_folder: "assets/images/posts"
public_folder: "/assets/images/posts"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Categories", name: "categories", widget: "list", default: ["general"]}
      - {label: "Body", name: "body", widget: "markdown"}
      
  - name: "projects"
    label: "Portfolio Projects"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "project"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "string"}
      - {label: "Permalink (e.g. /projects/workctl/)", name: "permalink", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "editorials"
    label: "DSA Editorials"
    folder: "_editorials"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title (e.g. Valid Palindrome Solution)", name: "title", widget: "string"}
      - {label: "Problem ID", name: "problem_id", widget: "string", required: false}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "data"
    label: "Data Files"
    files:
      - name: "problems_database"
        label: "DSA Problems Database"
        file: "_data/problems.yml"
        description: "The global payload powering the interactive Problems Hub."
        fields:
          - name: "problems"
            label: "All Problems"
            widget: "list"
            fields:
              - {label: "Problem ID / LeetCode Number", name: "id", widget: "string"}
              - {label: "Problem Title", name: "title", widget: "string"}
              - {label: "Platform", name: "platform", widget: "select", options: ["leetcode", "gfg"]}
              - {label: "Difficulty", name: "difficulty", widget: "select", options: ["easy", "medium", "hard"]}
              - {label: "Topics", name: "topics", widget: "list", default: ["arrays"]}
              - {label: "Solved", name: "solved", widget: "boolean", default: false}
              - {label: "External Problem URL", name: "problem_url", widget: "string"}
              - {label: "My Approach Link", name: "approach_url", widget: "string", required: false}
              - {label: "My Solution Link", name: "solution_url", widget: "string", required: false}
