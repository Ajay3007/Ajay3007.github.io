<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="274px" preserveAspectRatio="none" style="width:1215px;height:274px;" version="1.1" viewBox="0 0 1215 274" width="1215px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="230" x="501.5" y="16.708">The Evolution of Firewalls</text><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="512" x="360.5" y="37.6611">(each generation adds more context and inspects deeper)</text><!--entity G1--><rect fill="#F8FAFC" height="146.0781" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="254" x="6" y="66.4063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="104" x="16" y="89.4014">GENERATION 1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="147" x="22" y="121.9951">Layer 3 / 4 · Stateless</text><line style="stroke: #000000; stroke-width: 1.0;" x1="7" x2="91" y1="100.8516" y2="100.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="7" x2="91" y1="102.8516" y2="102.8516"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="84" x="91" y="105.1982">Packet Filter</text><line style="stroke: #000000; stroke-width: 1.0;" x1="175" x2="259" y1="100.8516" y2="100.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="175" x2="259" y1="102.8516" y2="102.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="7" x2="259" y1="129.2969" y2="129.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="222" x="22" y="146.292">- Allow/deny on IP, port, protocol</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="115" x="22" y="162.5889">- Static ACL rules</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="198" x="22" y="178.8857">- No memory of past packets</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="171" x="22" y="195.1826">Fast, but blind to context</text><!--entity G2--><rect fill="#F0F9FF" height="129.7813" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="359" x="295.5" y="74.4063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="104" x="305.5" y="97.4014">GENERATION 2</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="135" x="311.5" y="129.9951">Layer 3 / 4 · Stateful</text><line style="stroke: #000000; stroke-width: 1.0;" x1="296.5" x2="422" y1="108.8516" y2="108.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="296.5" x2="422" y1="110.8516" y2="110.8516"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="106" x="422" y="113.1982">Stateful Firewall</text><line style="stroke: #000000; stroke-width: 1.0;" x1="528" x2="653.5" y1="108.8516" y2="108.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="528" x2="653.5" y1="110.8516" y2="110.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="296.5" x2="653.5" y1="137.2969" y2="137.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="255" x="311.5" y="154.292">- Tracks connection state (flow table)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="327" x="311.5" y="170.5889">- Return traffic auto-allowed for known sessions</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="238" x="311.5" y="186.8857">Knows sessions, not their contents</text><!--entity G3--><rect fill="#FAF5FF" height="129.7813" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="273" x="689.5" y="74.4063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="104" x="699.5" y="97.4014">GENERATION 3</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="146" x="705.5" y="129.9951">Layer 7 · Per-protocol</text><line style="stroke: #000000; stroke-width: 1.0;" x1="690.5" x2="763.5" y1="108.8516" y2="108.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="690.5" x2="763.5" y1="110.8516" y2="110.8516"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="125" x="763.5" y="113.1982">Application / Proxy</text><line style="stroke: #000000; stroke-width: 1.0;" x1="888.5" x2="961.5" y1="108.8516" y2="108.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="888.5" x2="961.5" y1="110.8516" y2="110.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="690.5" x2="961.5" y1="137.2969" y2="137.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="238" x="705.5" y="154.292">- Proxies specific apps (HTTP, FTP)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="188" x="705.5" y="170.5889">- Reads application payload</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="241" x="705.5" y="186.8857">Deep, but narrow and slow to scale</text><!--entity G4--><rect fill="#ECFDF5" height="178.6719" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="217" x="997.5" y="49.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="165" x="1007.5" y="72.9014">GENERATION 4 · TODAY</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="150" x="1013.5" y="105.4951">All layers · Full context</text><line style="stroke: #000000; stroke-width: 1.0;" x1="998.5" x2="1046.5" y1="84.3516" y2="84.3516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="998.5" x2="1046.5" y1="86.3516" y2="86.3516"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="119" x="1046.5" y="88.6982">Next-Gen Firewall</text><line style="stroke: #000000; stroke-width: 1.0;" x1="1165.5" x2="1213.5" y1="84.3516" y2="84.3516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="1165.5" x2="1213.5" y1="86.3516" y2="86.3516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="998.5" x2="1213.5" y1="112.7969" y2="112.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="169" x="1013.5" y="129.792">- Everything above, plus:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="174" x="1013.5" y="146.0889">- Deep packet inspection</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="124" x="1013.5" y="162.3857">- App-ID + IPS/IDS</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="110" x="1013.5" y="178.6826">- TLS inspection</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="155" x="1013.5" y="194.9795">- VPN, NAT, threat intel</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="185" x="1013.5" y="211.2764">Sees context AND content</text><path d="M260.25,139.4063 C270.25,139.4063 280.25,139.4063 290.25,139.4063 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="295.48,139.4063,286.48,135.4063,290.48,139.4063,286.48,143.4063,295.48,139.4063" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M654.61,139.4063 C664.5,139.4063 674.38,139.4063 684.26,139.4063 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="689.43,139.4063,680.43,135.4063,684.43,139.4063,680.43,143.4063,689.43,139.4063" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M962.72,139.4063 C972.57,139.4063 982.42,139.4063 992.27,139.4063 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="997.42,139.4063,988.42,135.4063,992.42,139.4063,988.42,143.4063,997.42,139.4063" style="stroke: #A80036; stroke-width: 1.0;"/><rect fill="#DDDDDD" height="26.2969" rx="5" ry="5" style="stroke: #000000; stroke-width: 1.0;" width="462" x="385" y="246.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="450" x="391" y="264.9014">more context  ·  deeper inspection  ·  more capabilities in one box</text></g></svg>