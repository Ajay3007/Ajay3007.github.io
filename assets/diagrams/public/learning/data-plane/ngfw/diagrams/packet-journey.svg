<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="799px" preserveAspectRatio="none" style="width:538px;height:799px;" version="1.1" viewBox="0 0 538 799" width="538px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="525" x="12" y="26.708">One Packet's Journey — inspected flow going out over VPN</text><ellipse cx="219" cy="40.9531" fill="#000000" rx="10" ry="10" style="stroke: none; stroke-width: 1.0;"/><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="338" x="50" y="70.9531"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="255" x="60" y="92.0918">0. Ingress — inbound VLAN sub-interface</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="318" x="60" y="106.0605">packet arrives; 5-tuple (src:port -&gt; dst:port, proto)</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="271" x="83.5" y="138.8906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="71" x="93.5" y="160.0293">1. ip4-input</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="251" x="93.5" y="173.998">parse + validate header, checksum, TTL</text><rect fill="#FEFECE" height="61.9063" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="316" x="61" y="206.8281"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="76" x="71" y="227.9668">2. acl-plugin</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="296" x="71" y="241.9355">rule match -&gt; steering tag = SNORT_NAT_IPSEC</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="139" x="71" y="255.9043">[opaque2[0..3] = tag]</text><rect fill="#FEFECE" height="61.9063" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="325" x="56.5" y="288.7344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="101" x="66.5" y="309.873">3. ngfw-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="305" x="66.5" y="323.8418">action = snort-then-nat-then-ipsec; continue arc</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="269" x="66.5" y="337.8105">[note = { cookie 0xAB, post=NAT, sa=# }]</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="370" x="34" y="370.6406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="108" x="44" y="391.7793">4. snort-ip4-input</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="350" x="44" y="405.748">deep inspection -&gt; verdict PASS (a DROP never returns)</text><rect fill="#FEFECE" height="61.9063" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="264" x="87" y="438.5781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="114" x="97" y="459.7168">5. ngfw-post-snort</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="244" x="97" y="473.6855">cookie 0xAB valid -&gt; post_action = NAT</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="236" x="97" y="487.6543">[read note -&gt; NAT; cookie consumed]</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="366" x="36" y="520.4844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="53" x="46" y="541.623">6. nat44</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="346" x="46" y="555.5918">translate source addr/port; open a session (flow state)</text><rect fill="#FEFECE" height="61.9063" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="243" x="97.5" y="588.4219"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="98" x="107.5" y="609.5605">7. esp4-encrypt</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="223" x="107.5" y="623.5293">encrypt with the outbound IPsec SA</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="184" x="107.5" y="637.498">[buffer.ipsec.sad_index = SA]</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="323" x="57.5" y="670.3281"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="251" x="67.5" y="691.4668">8. Egress — VPN-out VLAN sub-interface</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="303" x="67.5" y="705.4355">encrypted packet leaves toward the tunnel peer</text><polygon fill="#FBFB77" points="249,728.2656,249,798.7969,505,798.7969,505,738.2656,495,728.2656,249,728.2656" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#FBFB77" points="249,728.2656,249,759.5313,229,763.5313,249,767.5313,249,798.7969,505,798.7969,505,738.2656,495,728.2656,249,728.2656" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="495" x2="495" y1="728.2656" y2="738.2656"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="505" x2="495" y1="738.2656" y2="738.2656"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="154" x="255" y="745.3325">Drop paths (not shown):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="235" x="255" y="760.4653">- policy DROP -&gt; error-drop at step 3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="220" x="255" y="775.5981">- Snort DROP verdict -&gt; error-drop</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="145" x="263" y="790.731">(never reaches step 5)</text><ellipse cx="219" cy="763.5313" fill="none" rx="10" ry="10" style="stroke: #000000; stroke-width: 1.0;"/><ellipse cx="219.5" cy="764.0313" fill="#000000" rx="6" ry="6" style="stroke: none; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="50.9531" y2="70.9531"/><polygon fill="#A80036" points="215,60.9531,219,70.9531,223,60.9531,219,64.9531" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="118.8906" y2="138.8906"/><polygon fill="#A80036" points="215,128.8906,219,138.8906,223,128.8906,219,132.8906" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="186.8281" y2="206.8281"/><polygon fill="#A80036" points="215,196.8281,219,206.8281,223,196.8281,219,200.8281" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="268.7344" y2="288.7344"/><polygon fill="#A80036" points="215,278.7344,219,288.7344,223,278.7344,219,282.7344" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="350.6406" y2="370.6406"/><polygon fill="#A80036" points="215,360.6406,219,370.6406,223,360.6406,219,364.6406" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="418.5781" y2="438.5781"/><polygon fill="#A80036" points="215,428.5781,219,438.5781,223,428.5781,219,432.5781" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="500.4844" y2="520.4844"/><polygon fill="#A80036" points="215,510.4844,219,520.4844,223,510.4844,219,514.4844" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="568.4219" y2="588.4219"/><polygon fill="#A80036" points="215,578.4219,219,588.4219,223,578.4219,219,582.4219" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="650.3281" y2="670.3281"/><polygon fill="#A80036" points="215,660.3281,219,670.3281,223,660.3281,219,664.3281" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="219" x2="219" y1="718.2656" y2="753.5313"/><polygon fill="#A80036" points="215,743.5313,219,753.5313,223,743.5313,219,747.5313" style="stroke: #A80036; stroke-width: 1.0;"/></g></svg>