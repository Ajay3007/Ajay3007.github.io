<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="309px" preserveAspectRatio="none" style="width:1323px;height:309px;" version="1.1" viewBox="0 0 1323 309" width="1323px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="263" x="539" y="16.708">Steering Tag -&gt; Pipeline Path</text><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="330" x="505.5" y="37.6611">(one ACL classification, six outcomes)</text><!--entity ROOT--><rect fill="#0F766E" height="52.5938" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="124" x="570" y="49.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="73" x="580" y="72.9014">ACL match</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="104" x="580" y="89.1982">-&gt; steering tag</text><!--entity R1--><rect fill="#F1F5F9" height="68.8906" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="114" x="6" y="162.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="40" x="16" y="185.9014">NONE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="94" x="16" y="202.1982">-&gt; ip4-lookup</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="94" x="16" y="218.4951">(default pass)</text><!--entity R2--><rect fill="#F1F5F9" height="68.8906" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="179" x="155.5" y="162.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="71" x="165.5" y="185.9014">NAT_PASS</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="159" x="165.5" y="202.1982">-&gt; nat44 -&gt; ip4-lookup</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="129" x="165.5" y="218.4951">(NAT then forward)</text><!--entity R3--><rect fill="#F1F5F9" height="68.8906" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="240" x="370" y="162.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="84" x="380" y="185.9014">SNORT_NAT</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="220" x="380" y="202.1982">-&gt; snort -&gt; nat44 -&gt; ip4-lookup</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="156" x="380" y="218.4951">(inspect, NAT, forward)</text><!--entity R4--><rect fill="#F1F5F9" height="68.8906" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="259" x="645.5" y="162.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="131" x="655.5" y="185.9014">SNORT_NAT_IPSEC</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="239" x="655.5" y="202.1982">-&gt; snort -&gt; nat44 -&gt; esp4-encrypt</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="133" x="655.5" y="218.4951">(inspect, NAT, VPN)</text><!--entity R5--><rect fill="#F1F5F9" height="68.8906" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="198" x="940" y="162.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="75" x="950" y="185.9014">NAT_IPSEC</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="178" x="950" y="202.1982">-&gt; nat44 -&gt; esp4-encrypt</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="176" x="950" y="218.4951">(NAT, VPN, no inspection)</text><!--entity R6--><rect fill="#FEF2F2" height="68.8906" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="149" x="1173.5" y="162.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="41" x="1183.5" y="185.9014">DROP</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="91" x="1183.5" y="202.1982">-&gt; error-drop</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="129" x="1183.5" y="218.4951">(packet discarded)</text><path d="M569.63,83.1763 C474.78,93.0663 289.33,116.8063 138,162.9063 C133.69,164.2163 129.31,165.7163 124.93,167.3363 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="120.18,169.1363,130.015,169.659,124.8504,167.3509,127.1585,162.1864,120.18,169.1363" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M569.96,96.2163 C513.2,113.4563 426.9,139.7463 352,162.9063 C347.92,164.1663 343.76,165.4563 339.56,166.7663 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="334.6,168.3063,344.3823,169.4497,339.3739,166.8198,342.0039,161.8114,334.6,168.3063" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M601.54,102.9363 C581.9,119.3963 556.03,141.0663 534.16,159.3963 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="530.12,162.7863,539.5898,160.0802,533.9553,159.5783,534.4571,153.9438,530.12,162.7863" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M662.68,102.9363 C682.46,119.3963 708.5,141.0663 730.53,159.3963 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="734.6,162.7863,730.2435,153.9533,730.7577,159.5867,725.1243,160.1009,734.6,162.7863" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M694.26,95.6062 C758.21,114.3063 858.89,143.7463 934.97,165.9862 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="939.94,167.4463,932.42,161.0862,935.14,166.0463,930.18,168.7662,939.94,167.4463" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M694.09,83.7163 C793,94.6263 991.9,120.0463 1156,162.9063 C1160.08,163.9763 1164.23,165.1463 1168.4,166.3963 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="1173.31,167.8963,1165.883,161.4279,1168.5308,166.4268,1163.5319,169.0746,1173.31,167.8963" style="stroke: #A80036; stroke-width: 1.0;"/><rect fill="#DDDDDD" height="58.8906" rx="5" ry="5" style="stroke: #000000; stroke-width: 1.0;" width="575" x="382.5" y="249.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="544" x="388.5" y="267.9014">Inside ngfw-decision each tag maps to an action; a note in opaque2 carries the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="532" x="388.5" y="284.1982">"after Snort" part (NAT / IPsec / pass). The same six paths exist for IPv6 via the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="563" x="388.5" y="300.4951">mirror -ip6 nodes and nat66. Return traffic is matched by NAT/IPsec session state.</text></g></svg>