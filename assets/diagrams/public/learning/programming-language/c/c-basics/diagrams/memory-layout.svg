Glyphs" textLength="115" x="77" y="506.542">Grows upward ↑</text><!--entity STACK--><rect fill="#FEFECE" height="85.1875" style="stroke: #A80036; stroke-width: 1.5;" width="173" x="59.5" y="579.9531"/><rect fill="#FEFECE" height="5" style="stroke: #A80036; stroke-width: 1.5;" width="10" x="54.5" y="584.9531"/><rect fill="#FEFECE" height="5" style="stroke: #A80036; stroke-width: 1.5;" width="10" x="54.5" y="655.1406"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="38" x="69.5" y="602.9482">Stack</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="111" x="69.5" y="619.2451">Function frames</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="153" x="69.5" y="635.542">Locals, return address</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="135" x="69.5" y="651.8389">Grows downward ↓</text><polygon fill="#FBFB77" points="274,602.4531,274,642.7188,518,642.7188,518,612.4531,508,602.4531,274,602.4531" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="508" x2="508" y1="602.4531" y2="612.4531"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="518" x2="508" y1="612.4531" y2="612.4531"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="223" x="280" y="619.52">Heap allocations persist until free()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="169" x="280" y="634.6528">Fragmentation may occur.</text><polygon fill="#FBFB77" points="6,724.9531,6,765.2188,286,765.2188,286,734.9531,276,724.9531,6,724.9531" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#FBFB77" points="6,724.9531,6,765.2188,286,765.2188,286,734.9531,276,724.9531,150,724.9531,146,664.9531,142,724.9531,