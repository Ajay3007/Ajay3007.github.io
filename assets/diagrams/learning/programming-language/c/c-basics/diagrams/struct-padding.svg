link SA to GMN3--><path d="M87.05,65.9531 C97.68,65.9531 109.72,65.9531 122.28,65.9531 " fill="none" id="SA-GMN3" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><!--MD5=[f78bdd92f55e57d190c46fcc8da46cfd]
@startuml
skinparam shadowing false
skinparam linetype ortho
title Structure Padding Example

class "struct A" as SA {
  + char c
  + int  i
}

note right of SA
Expected = 1 + 4 = 5 bytes
Actual   = 8 bytes (padding added)
end note

note bottom
Typical layout:
| c | pad pad pad | i i i i |
end note
@enduml

