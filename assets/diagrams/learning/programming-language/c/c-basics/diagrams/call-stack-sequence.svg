y="259.8481">return</text><polygon fill="#A80036" points="38,290.0469,28,294.0469,38,298.0469,34,294.0469" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="32" x2="139" y1="294.0469" y2="294.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="82" x="44" y="288.981">exit program</text><!--MD5=[42e70eb9754082770eb4a6109066a529]
@startuml
skinparam shadowing false
title Function Call Flow (Stack Frames)

actor User
participant "main()" as MAIN
participant "funcA()" as A
participant "funcB()" as B

User -> MAIN: start program
activate MAIN

MAIN -> A: call funcA()
activate A

A -> B: call funcB()
activate B

B - -> A: return
deactivate B

A - -> MAIN: return
deactivate A

MAIN - -> User: exit program
deactivate MAIN
@enduml

