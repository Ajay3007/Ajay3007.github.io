l="#A80036" points="271.5,125.5156,281.5,129.5156,271.5,133.5156,275.5,129.5156" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="185.5" x2="277.5" y1="129.5156" y2="129.5156"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="54" x="192.5" y="124.4497">op(10,5)</text><polygon fill="#A80036" points="191.5,154.6484,181.5,158.6484,191.5,162.6484,187.5,158.6484" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="185.5" x2="282.5" y1="158.6484" y2="158.6484"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="59" x="197.5" y="153.5825">return 15</text><polygon fill="#A80036" points="163.5,183.7813,173.5,187.7813,163.5,191.7813,167.5,187.7813" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="36.5" x2="169.5" y1="187.7813" y2="187.7813"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="119" x="43.5" y="182.7153">operate(10,5, sub)</text><polygon fill="#A80036" points="349.5,212.9141,359.5,216.9141,349.5,220.9141,353.5,216.9141" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="185.5" x2="355.5" y1="216.9141" y2="216.9141"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="54" x="192.5" y="211.8481">op(10,5)</text><polygon fill="#A80036" points="191.5,242.0469,181.5,246.0469,191.5,250.0469,187.5,246.0469" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="185.5" x2="360.5" y1="246.0469" y2="246.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="51" x="197.5" y="240.981">return 5</text><!--MD5=[da5688913c297171bd95be21434d72d1]
@startuml
skinparam shadowing false
title Function Pointer Callback Flow

participant "main()" as MAIN
participant "operate(x,y,op)" as OP
participant "add(x,y)" as ADD
participant "sub(x,y)" as SUB

MAIN -> OP: operate(10,5, add)
activate OP
OP -> ADD: op(10,5)
ADD - -> OP: return 15
deactivate OP

MAIN -> OP: operate(10,5, sub)
activate OP
OP -> SUB: op(10,5)
SUB - -> OP: return 5
deactivate OP
@enduml

