link P to ARR--><path d="M309,76.9931 C309,110.9631 309,168.9531 309,168.9531 C309,168.9531 166.1,168.9531 166.1,168.9531 " fill="none" id="P-&gt;ARR" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="161.1,168.9531,170.1,172.9531,166.1,168.9531,170.1,164.9531,161.1,168.9531" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="87" x="223.5" y="120.02">points to A[0]</text><!--MD5=[b69f5ff1958cefbbc63e0abc2c7b0e3e]
@startuml
skinparam shadowing false
skinparam linetype ortho
title Arrays and Pointers (Address & Arithmetic)

object "A : int[5]\nbase = &A[0] = 0x400" as ARR {
  "A[0] = 2  @0x400"
  "A[1] = 4  @0x404"
  "A[2] = 5  @0x408"
  "A[3] = 8  @0x40C"
  "A[4] = 1  @0x410"
}

object "p : int*\nvalue = &A[0]" as P

P - -> ARR : points to A[0]

note right of ARR
A[i]  == *(A + i)
&A[i] == (A + i)
end note

note bottom of P
p+1 jumps by sizeof(int)=4 bytes
end note
@enduml

