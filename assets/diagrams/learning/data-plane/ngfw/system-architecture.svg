<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="740" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1f36">NGFW Platform — System Architecture</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#64748b">The user-space data plane (VPP) is the hub; every other engine plugs into it. Colors mark the three planes.</text>

  <!-- ===== MANAGEMENT PLANE (top) ===== -->
  <rect x="300" y="76" width="500" height="100" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="550" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">MANAGEMENT PLANE — Management Bridge (Java)</text>
  <g font-size="11">
    <rect x="316" y="112" width="150" height="50" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="391" y="133" text-anchor="middle" fill="#3730a3">Northbound API</text>
    <text x="391" y="149" text-anchor="middle" fill="#6366f1" font-size="10">HTTP server</text>
    <rect x="476" y="112" width="150" height="50" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="551" y="133" text-anchor="middle" fill="#3730a3">Alarms + Stats</text>
    <text x="551" y="149" text-anchor="middle" fill="#6366f1" font-size="10">counters, health</text>
    <rect x="636" y="112" width="148" height="50" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="710" y="133" text-anchor="middle" fill="#3730a3">Log / Analytics</text>
    <text x="710" y="149" text-anchor="middle" fill="#6366f1" font-size="10">event store</text>
  </g>

  <!-- ===== CONTROL PLANE (left) ===== -->
  <text x="45" y="244" font-size="13" font-weight="700" fill="#c2410c">CONTROL PLANE</text>
  <rect x="40" y="252" width="232" height="96" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="156" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">IKE Daemon</text>
  <text x="156" y="304" text-anchor="middle" font-size="11" fill="#c2410c">StrongSwan charon</text>
  <text x="156" y="324" text-anchor="middle" font-size="10.5" fill="#ea580c">negotiates VPN keys</text>

  <rect x="40" y="392" width="232" height="96" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="156" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Control Scripts</text>
  <text x="156" y="444" text-anchor="middle" font-size="11" fill="#c2410c">Python / VICI</text>
  <text x="156" y="464" text-anchor="middle" font-size="10.5" fill="#ea580c">load connections &amp; SAs</text>

  <!-- ===== DATA PLANE (center hub) ===== -->
  <rect x="300" y="250" width="500" height="336" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="550" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">DATA PLANE — VPP (user-space forwarding)</text>
  <text x="550" y="296" text-anchor="middle" font-size="10.5" fill="#0d9488">vector packet processing · runs on every packet</text>

  <!-- plugin chips -->
  <g font-size="11" font-weight="600">
    <rect x="316" y="312" width="150" height="52" rx="7" fill="#ffffff" stroke="#5eead4"/>
    <text x="391" y="334" text-anchor="middle" fill="#0f766e">ngfw_decision</text>
    <text x="391" y="350" text-anchor="middle" fill="#64748b" font-size="9.5" font-weight="400">policy &amp; steering</text>
    <rect x="476" y="312" width="150" height="52" rx="7" fill="#ffffff" stroke="#5eead4"/>
    <text x="551" y="334" text-anchor="middle" fill="#0f766e">acl</text>
    <text x="551" y="350" text-anchor="middle" fill="#64748b" font-size="9.5" font-weight="400">rule match → tag</text>
    <rect x="636" y="312" width="148" height="52" rx="7" fill="#ffffff" stroke="#5eead4"/>
    <text x="710" y="334" text-anchor="middle" fill="#0f766e">nat44 / nat66</text>
    <text x="710" y="350" text-anchor="middle" fill="#64748b" font-size="9.5" font-weight="400">address translate</text>

    <rect x="316" y="376" width="150" height="52" rx="7" fill="#fff1f2" stroke="#fda4af"/>
    <text x="391" y="398" text-anchor="middle" fill="#be123c">snort-plugin</text>
    <text x="391" y="414" text-anchor="middle" fill="#64748b" font-size="9.5" font-weight="400">+ VPP DAQ</text>
    <rect x="476" y="376" width="150" height="52" rx="7" fill="#ffffff" stroke="#5eead4"/>
    <text x="551" y="398" text-anchor="middle" fill="#0f766e">linux-cp</text>
    <text x="551" y="414" text-anchor="middle" fill="#64748b" font-size="9.5" font-weight="400">host mirror ifaces</text>
    <rect x="636" y="376" width="148" height="52" rx="7" fill="#ffffff" stroke="#5eead4"/>
    <text x="710" y="398" text-anchor="middle" fill="#0f766e">dpdk / ipsec</text>
    <text x="710" y="414" text-anchor="middle" fill="#64748b" font-size="9.5" font-weight="400">NIC I/O · ESP crypto</text>
  </g>

  <!-- feature-arc pipeline note -->
  <rect x="316" y="446" width="468" height="60" rx="8" fill="#0f766e"/>
  <text x="550" y="470" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Feature-arc pipeline (per interface)</text>
  <text x="550" y="491" text-anchor="middle" font-size="11" fill="#99f6e4">ngfw-decision → snort → ngfw-post-snort → nat / esp-encrypt → ip-lookup</text>

  <!-- API sockets note inside data plane -->
  <rect x="316" y="518" width="468" height="52" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="550" y="539" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f766e">Control sockets: CLI · binary API · stats segment</text>
  <text x="550" y="556" text-anchor="middle" font-size="9.5" fill="#64748b">the doors other planes use to program &amp; read the data plane</text>

  <!-- ===== IPS ENGINE (right) ===== -->
  <text x="835" y="244" font-size="13" font-weight="700" fill="#be123c">IPS ENGINE</text>
  <rect x="830" y="252" width="230" height="252" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="945" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">Snort IPS × N</text>
  <text x="945" y="296" text-anchor="middle" font-size="10.5" fill="#e11d48">user-space processes, pinned to cores</text>
  <g font-size="11" font-weight="600" fill="#9f1239">
    <rect x="846" y="312" width="90" height="40" rx="6" fill="#ffffff" stroke="#fda4af"/>
    <text x="891" y="337" text-anchor="middle">snort0</text>
    <rect x="954" y="312" width="90" height="40" rx="6" fill="#ffffff" stroke="#fda4af"/>
    <text x="999" y="337" text-anchor="middle">snort1</text>
    <rect x="846" y="362" width="90" height="40" rx="6" fill="#ffffff" stroke="#fda4af"/>
    <text x="891" y="387" text-anchor="middle">snort2</text>
    <rect x="954" y="362" width="90" height="40" rx="6" fill="#ffffff" stroke="#fda4af"/>
    <text x="999" y="387" text-anchor="middle">snort3</text>
  </g>
  <text x="945" y="432" text-anchor="middle" font-size="10.5" fill="#e11d48">each loads the VPP DAQ module</text>
  <text x="945" y="450" text-anchor="middle" font-size="10.5" fill="#e11d48">reads packets from shared memory</text>
  <text x="945" y="468" text-anchor="middle" font-size="10.5" fill="#e11d48">writes back a verdict + SID</text>
  <text x="945" y="486" text-anchor="middle" font-size="10.5" fill="#e11d48">rules matched against threat sigs</text>

  <!-- ===== NICs (bottom) ===== -->
  <rect x="300" y="632" width="500" height="66" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="550" y="662" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Physical NICs</text>
  <text x="550" y="682" text-anchor="middle" font-size="10.5" fill="#64748b">DPDK-bound · kernel-bypass · VLAN sub-interfaces (in / VPN-out / internet-out)</text>

  <!-- ===== CONNECTORS ===== -->
  <!-- mgmt <-> data (JNI + sockets) -->
  <line x1="550" y1="176" x2="550" y2="248" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
  <rect x="566" y="192" width="150" height="38" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="641" y="208" text-anchor="middle" font-size="9.5" fill="#4338ca">JNI native bridge</text>
  <text x="641" y="222" text-anchor="middle" font-size="9" fill="#6366f1">stats + binary API sockets</text>

  <!-- charon <-> scripts (VICI) -->
  <line x1="156" y1="348" x2="156" y2="392" stroke="#c2410c" stroke-width="2" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <text x="200" y="374" text-anchor="middle" font-size="9.5" fill="#c2410c">VICI socket</text>

  <!-- charon -> data plane (program SAs) -->
  <line x1="272" y1="288" x2="298" y2="330" stroke="#c2410c" stroke-width="2" marker-end="url(#ao)"/>
  <text x="286" y="284" text-anchor="middle" font-size="9" fill="#c2410c">program IPsec SAs</text>

  <!-- scripts -> data plane (CLI) -->
  <line x1="272" y1="440" x2="298" y2="440" stroke="#c2410c" stroke-width="2" marker-end="url(#ao)"/>
  <text x="286" y="432" text-anchor="middle" font-size="9" fill="#c2410c">VPP CLI</text>

  <!-- data <-> snort (shared mem + verdict) -->
  <line x1="800" y1="360" x2="828" y2="360" stroke="#be123c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="814" y="350" text-anchor="middle" font-size="9" fill="#be123c">packets</text>
  <line x1="828" y1="392" x2="800" y2="392" stroke="#be123c" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="814" y="410" text-anchor="middle" font-size="9" fill="#be123c">verdict</text>
  <text x="814" y="330" text-anchor="middle" font-size="8.5" fill="#9f1239">shared memory + DAQ socket</text>

  <!-- nic <-> data plane -->
  <line x1="550" y1="586" x2="550" y2="630" stroke="#334155" stroke-width="2" marker-start="url(#as)" marker-end="url(#as)"/>
  <text x="608" y="612" text-anchor="middle" font-size="9.5" fill="#334155">DPDK poll-mode</text>

  <defs>
    <marker id="ai" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#4338ca"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#c2410c"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#be123c"/></marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#be123c"/></marker>
    <marker id="as" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#334155"/></marker>
  </defs>
</svg>
