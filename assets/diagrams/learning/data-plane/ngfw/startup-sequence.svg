<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="700" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1f36">Startup Sequence</text>
  <text x="380" y="57" text-anchor="middle" font-size="12.5" fill="#64748b">One orchestrator script brings the planes up in dependency order</text>

  <!-- steps -->
  <g font-size="13">
    <!-- 1 -->
    <rect x="150" y="80" width="460" height="62" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="180" cy="111" r="15" fill="#334155"/><text x="180" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="212" y="106" font-size="13" font-weight="700" fill="#1a1f36">Render config from templates</text>
    <text x="212" y="126" font-size="11" fill="#64748b">envsubst fills env-file values into startup + interface config</text>

    <!-- 2 -->
    <rect x="150" y="164" width="460" height="62" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="180" cy="195" r="15" fill="#0f766e"/><text x="180" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="212" y="190" font-size="13" font-weight="700" fill="#0f766e">Launch VPP (data plane)</text>
    <text x="212" y="210" font-size="11" fill="#64748b">binds NICs via DPDK, starts worker threads on pinned cores</text>

    <!-- 3 -->
    <rect x="150" y="248" width="460" height="62" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="180" cy="279" r="15" fill="#0f766e"/><text x="180" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="212" y="274" font-size="13" font-weight="700" fill="#0f766e">Apply interface config</text>
    <text x="212" y="294" font-size="11" fill="#64748b">VLAN sub-ifaces, IPs, feature arcs, NAT enable — the pipeline</text>

    <!-- 4 -->
    <rect x="150" y="332" width="460" height="62" rx="9" fill="#fff1f2" stroke="#fda4af"/>
    <circle cx="180" cy="363" r="15" fill="#be123c"/><text x="180" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="212" y="358" font-size="13" font-weight="700" fill="#be123c">Start Snort IPS instances</text>
    <text x="212" y="378" font-size="11" fill="#64748b">N processes pinned to cores; each attaches to VPP via the DAQ</text>

    <!-- 5 -->
    <rect x="150" y="416" width="460" height="62" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="180" cy="447" r="15" fill="#c2410c"/><text x="180" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
    <text x="212" y="442" font-size="13" font-weight="700" fill="#9a3412">Start IKE daemon (control)</text>
    <text x="212" y="462" font-size="11" fill="#64748b">StrongSwan charon comes up, ready to negotiate VPN tunnels</text>

    <!-- 6 -->
    <rect x="150" y="500" width="460" height="62" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <circle cx="180" cy="531" r="15" fill="#4338ca"/><text x="180" y="536" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
    <text x="212" y="526" font-size="13" font-weight="700" fill="#4338ca">Start management bridge</text>
    <text x="212" y="546" font-size="11" fill="#64748b">Java process attaches to VPP stats/API; serves counters northbound</text>

    <!-- 7 -->
    <rect x="150" y="584" width="460" height="62" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="180" cy="615" r="15" fill="#0f766e"/><text x="180" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text>
    <text x="212" y="610" font-size="13" font-weight="700" fill="#0f766e">Seed management ACL rules</text>
    <text x="212" y="630" font-size="11" fill="#64748b">baseline permit rules so the box is reachable for management</text>
  </g>

  <!-- connecting arrows -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="180" y1="142" x2="180" y2="164"/>
    <line x1="180" y1="226" x2="180" y2="248"/>
    <line x1="180" y1="310" x2="180" y2="332"/>
    <line x1="180" y1="394" x2="180" y2="416"/>
    <line x1="180" y1="478" x2="180" y2="500"/>
    <line x1="180" y1="562" x2="180" y2="584"/>
  </g>

  <text x="380" y="672" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Data plane first, then the engines that plug into it, then control, then management.</text>
</svg>
