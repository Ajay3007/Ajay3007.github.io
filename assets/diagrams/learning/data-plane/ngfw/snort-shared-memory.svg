<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="620" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1f36">VPP ↔ Snort over Shared Memory</text>
  <text x="590" y="57" text-anchor="middle" font-size="12.5" fill="#64748b">A per-thread queue pair carries packet descriptors out and verdicts back — packet bytes stay in a shared buffer pool (zero copy).</text>

  <!-- VPP worker -->
  <rect x="36" y="120" width="220" height="380" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="146" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e">VPP worker thread</text>
  <text x="146" y="167" text-anchor="middle" font-size="10.5" fill="#0d9488">(snort-ip4-input node)</text>
  <g font-size="11" fill="#334155">
    <rect x="56" y="188" width="180" height="58" rx="7" fill="#ffffff" stroke="#5eead4"/>
    <text x="146" y="210" text-anchor="middle" font-weight="700" fill="#0f766e">enqueue</text>
    <text x="146" y="228" text-anchor="middle" font-size="10">write descriptor,</text>
    <text x="146" y="240" text-anchor="middle" font-size="10">bump enq head</text>
    <rect x="56" y="410" width="180" height="66" rx="7" fill="#ffffff" stroke="#5eead4"/>
    <text x="146" y="432" text-anchor="middle" font-weight="700" fill="#0f766e">dequeue</text>
    <text x="146" y="450" text-anchor="middle" font-size="10">read verdict,</text>
    <text x="146" y="462" text-anchor="middle" font-size="10">continue arc or drop</text>
  </g>

  <!-- shared memory -->
  <rect x="300" y="96" width="580" height="470" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 4"/>
  <text x="590" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">SHARED MEMORY  (mmap'd by both processes)</text>

  <!-- buffer pool -->
  <rect x="320" y="134" width="540" height="72" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="590" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4338ca">Buffer pool — the actual packet bytes</text>
  <g fill="#ffffff" stroke="#c7d2fe">
    <rect x="336" y="164" width="70" height="30" rx="4"/><rect x="416" y="164" width="70" height="30" rx="4"/>
    <rect x="496" y="164" width="70" height="30" rx="4"/><rect x="576" y="164" width="70" height="30" rx="4"/>
    <rect x="656" y="164" width="70" height="30" rx="4"/><rect x="736" y="164" width="108" height="30" rx="4"/>
  </g>
  <text x="590" y="184" text-anchor="middle" font-size="10" fill="#6366f1">packet 0   ·   packet 1   ·   packet 2   ·   …   (referenced by offset, never copied)</text>

  <!-- queue pair -->
  <rect x="320" y="220" width="540" height="330" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="590" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Per-thread queue pair (one per VPP worker)</text>

  <!-- enqueue ring -->
  <rect x="338" y="256" width="504" height="60" rx="7" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="352" y="278" font-size="11.5" font-weight="700" fill="#0f766e">Enqueue ring →</text>
  <text x="352" y="296" font-size="10" fill="#475569">VPP writes packet descriptors here for Snort to pick up</text>
  <text x="826" y="288" text-anchor="end" font-size="9.5" fill="#64748b">head / tail</text>

  <!-- descriptor -->
  <rect x="338" y="330" width="504" height="86" rx="7" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="352" y="352" font-size="11.5" font-weight="700" fill="#b45309">Descriptor (one slot)</text>
  <text x="352" y="372" font-size="10" fill="#475569">{ offset → buffer pool, length, buffer_pool_id }</text>
  <text x="352" y="390" font-size="10" fill="#475569">metadata union:  in → flags / flow_id / ingress</text>
  <text x="352" y="406" font-size="10" fill="#475569">metadata union:  out → verdict + appid + sid_entries[10]</text>

  <!-- dequeue ring -->
  <rect x="338" y="430" width="504" height="60" rx="7" fill="#fff1f2" stroke="#fda4af"/>
  <text x="352" y="452" font-size="11.5" font-weight="700" fill="#be123c">← Dequeue ring</text>
  <text x="352" y="470" font-size="10" fill="#475569">Snort writes the verdict back here for VPP to read</text>
  <text x="826" y="462" text-anchor="end" font-size="9.5" fill="#64748b">head / tail</text>

  <text x="590" y="516" text-anchor="middle" font-size="10" fill="#64748b">rings are lock-free SPSC; head/tail indices are the only cross-process synchronization</text>
  <text x="590" y="534" text-anchor="middle" font-size="10" fill="#64748b">signal: poll the ring, or wake via <tspan font-weight="700">deq_fd</tspan> eventfd (interrupt mode)</text>

  <!-- Snort -->
  <rect x="924" y="120" width="220" height="380" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
  <text x="1034" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#be123c">Snort instance</text>
  <text x="1034" y="167" text-anchor="middle" font-size="10.5" fill="#e11d48">(separate process + VPP DAQ)</text>
  <g font-size="11" fill="#334155">
    <rect x="944" y="188" width="180" height="58" rx="7" fill="#ffffff" stroke="#fda4af"/>
    <text x="1034" y="210" text-anchor="middle" font-weight="700" fill="#be123c">read descriptor</text>
    <text x="1034" y="228" text-anchor="middle" font-size="10">follow offset →</text>
    <text x="1034" y="240" text-anchor="middle" font-size="10">get packet bytes</text>
    <rect x="944" y="300" width="180" height="58" rx="7" fill="#ffffff" stroke="#fda4af"/>
    <text x="1034" y="322" text-anchor="middle" font-weight="700" fill="#be123c">inspect vs rules</text>
    <text x="1034" y="340" text-anchor="middle" font-size="10">DPI / signatures</text>
    <rect x="944" y="410" width="180" height="66" rx="7" fill="#ffffff" stroke="#fda4af"/>
    <text x="1034" y="432" text-anchor="middle" font-weight="700" fill="#be123c">write verdict</text>
    <text x="1034" y="450" text-anchor="middle" font-size="10">PASS / BLOCK</text>
    <text x="1034" y="462" text-anchor="middle" font-size="10">(+ SID, AppID)</text>
  </g>

  <!-- arrows: enqueue path -->
  <line x1="236" y1="217" x2="336" y2="270" stroke="#0f766e" stroke-width="2" marker-end="url(#sa)"/>
  <line x1="844" y1="270" x2="942" y2="217" stroke="#be123c" stroke-width="2" marker-end="url(#sb)"/>
  <!-- arrows: dequeue path -->
  <line x1="942" y1="452" x2="844" y2="452" stroke="#be123c" stroke-width="2" marker-end="url(#sb)"/>
  <line x1="336" y1="452" x2="238" y2="452" stroke="#0f766e" stroke-width="2" marker-end="url(#sa)"/>

  <!-- descriptor -> buffer pool dashed -->
  <line x1="500" y1="330" x2="500" y2="196" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#sc)"/>
  <text x="512" y="250" font-size="9" fill="#6366f1">offset</text>

  <text x="300" y="238" font-size="9.5" fill="#0f766e">packets →</text>
  <text x="880" y="238" font-size="9.5" fill="#be123c" text-anchor="end">→ read</text>
  <text x="880" y="444" font-size="9.5" fill="#be123c" text-anchor="end">verdict →</text>
  <text x="300" y="444" font-size="9.5" fill="#0f766e">← read</text>

  <defs>
    <marker id="sa" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#0f766e"/></marker>
    <marker id="sb" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#be123c"/></marker>
    <marker id="sc" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#c7d2fe"/></marker>
  </defs>
</svg>
