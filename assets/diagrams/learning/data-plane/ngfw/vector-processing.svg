<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1f36">Why "Vector" Packet Processing</text>
  <text x="500" y="57" text-anchor="middle" font-size="12.5" fill="#64748b">A node processes a whole batch (vector) of packets at once — not one packet all the way through the stack</text>

  <!-- input frame -->
  <text x="140" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Input frame (a vector)</text>
  <rect x="40" y="116" width="200" height="230" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <g font-size="11" fill="#1e40af" text-anchor="middle">
    <rect x="60" y="132" width="70" height="26" rx="4" fill="#ffffff" stroke="#bfdbfe"/><text x="95" y="150">pkt 0</text>
    <rect x="150" y="132" width="70" height="26" rx="4" fill="#ffffff" stroke="#bfdbfe"/><text x="185" y="150">pkt 1</text>
    <rect x="60" y="166" width="70" height="26" rx="4" fill="#ffffff" stroke="#bfdbfe"/><text x="95" y="184">pkt 2</text>
    <rect x="150" y="166" width="70" height="26" rx="4" fill="#ffffff" stroke="#bfdbfe"/><text x="185" y="184">pkt 3</text>
    <rect x="60" y="200" width="70" height="26" rx="4" fill="#ffffff" stroke="#bfdbfe"/><text x="95" y="218">pkt 4</text>
    <rect x="150" y="200" width="70" height="26" rx="4" fill="#ffffff" stroke="#bfdbfe"/><text x="185" y="218">…</text>
    <rect x="60" y="234" width="160" height="26" rx="4" fill="#ffffff" stroke="#bfdbfe"/><text x="140" y="252">pkt N-1</text>
  </g>
  <text x="140" y="290" text-anchor="middle" font-size="10.5" fill="#64748b">up to 256 packet</text>
  <text x="140" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">indices per frame</text>

  <!-- node -->
  <rect x="330" y="116" width="330" height="230" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="495" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">One VPP node function</text>

  <rect x="350" y="156" width="290" height="86" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="495" y="178" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Dual loop — 2 packets at a time</text>
  <text x="495" y="198" text-anchor="middle" font-size="10.5" fill="#475569">prefetch the next buffers while</text>
  <text x="495" y="214" text-anchor="middle" font-size="10.5" fill="#475569">processing the current pair →</text>
  <text x="495" y="232" text-anchor="middle" font-size="10.5" fill="#475569">hides memory latency, fills the CPU pipeline</text>

  <rect x="350" y="252" width="290" height="72" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="495" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Single loop — the leftover packets</text>
  <text x="495" y="294" text-anchor="middle" font-size="10.5" fill="#475569">handles the remainder (&lt; 2) one</text>
  <text x="495" y="310" text-anchor="middle" font-size="10.5" fill="#475569">at a time, same logic</text>

  <!-- output frames -->
  <text x="850" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Output frames</text>
  <text x="850" y="116" text-anchor="middle" font-size="10.5" fill="#64748b">grouped by next node</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="740" y="132" width="220" height="52" rx="7" fill="#ecfdf5" stroke="#5eead4"/>
    <text x="850" y="152" font-weight="700" fill="#0f766e">→ snort-ip4-input</text>
    <text x="850" y="170" fill="#64748b">packets to inspect</text>
    <rect x="740" y="196" width="220" height="52" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="850" y="216" font-weight="700" fill="#1e40af">→ ip4-lookup</text>
    <text x="850" y="234" fill="#64748b">passed packets</text>
    <rect x="740" y="260" width="220" height="52" rx="7" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="850" y="280" font-weight="700" fill="#c2410c">→ esp4-encrypt</text>
    <text x="850" y="298" fill="#64748b">packets to encrypt</text>
  </g>

  <!-- arrows -->
  <line x1="240" y1="231" x2="328" y2="231" stroke="#475569" stroke-width="2.5" marker-end="url(#va)"/>
  <line x1="660" y1="210" x2="738" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#va)"/>
  <line x1="660" y1="222" x2="738" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#va)"/>
  <line x1="660" y1="234" x2="738" y2="286" stroke="#475569" stroke-width="2" marker-end="url(#va)"/>

  <text x="500" y="384" text-anchor="middle" font-size="11.5" fill="#334155">Processing a batch keeps the node's code and data hot in CPU cache — the instruction stream and</text>
  <text x="500" y="404" text-anchor="middle" font-size="11.5" fill="#334155">data structures are reused across many packets, so the per-packet overhead is amortized down to a few nanoseconds.</text>
  <text x="500" y="426" text-anchor="middle" font-size="10.5" font-style="italic" fill="#94a3b8">This batching is the single biggest reason VPP hits line rate in software.</text>

  <defs>
    <marker id="va" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#475569"/></marker>
  </defs>
</svg>
