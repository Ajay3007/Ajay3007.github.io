<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="620" fill="#ffffff"/>
  <text x="540" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1f36">Two Ways to Talk to VPP</text>
  <text x="540" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">Reading counters and sending commands use different VPP client interfaces — for good reasons.</text>

  <!-- LEFT: stats segment -->
  <rect x="40" y="80" width="490" height="500" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="285" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Stats Segment — the READ path</text>
  <text x="285" y="130" text-anchor="middle" font-size="11" fill="#0d9488">get counters cheaply, continuously</text>

  <rect x="64" y="150" width="442" height="86" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="80" y="172" font-size="11.5" font-weight="700" fill="#0f766e">What it is</text>
  <text x="80" y="192" font-size="10.5" fill="#475569">A shared-memory region VPP publishes counters into.</text>
  <text x="80" y="209" font-size="10.5" fill="#475569">Readers map it and read directly — no request, no</text>
  <text x="80" y="226" font-size="10.5" fill="#475569">disturbance to the packet path.</text>

  <rect x="64" y="248" width="442" height="104" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="80" y="270" font-size="11.5" font-weight="700" fill="#0f766e">The catch: per-worker vectors</text>
  <text x="80" y="290" font-size="10.5" fill="#475569">Each VPP worker thread keeps its OWN copy of a counter.</text>
  <text x="80" y="307" font-size="10.5" fill="#475569">A total = sum across all workers. The bridge aggregates:</text>
  <rect x="80" y="316" width="410" height="28" rx="5" fill="#f0fdfa"/>
  <text x="90" y="335" font-family="Consolas, monospace" font-size="10" fill="#0f766e">for w in workers: total += counter[w][rule]</text>

  <rect x="64" y="364" width="442" height="74" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="80" y="386" font-size="11.5" font-weight="700" fill="#0f766e">Counter kinds</text>
  <text x="80" y="406" font-size="10.5" fill="#475569">• simple / scalar → a single number (e.g. total packets)</text>
  <text x="80" y="423" font-size="10.5" fill="#475569">• combined → packets AND bytes per entry (per ACL rule)</text>

  <rect x="64" y="450" width="442" height="110" rx="8" fill="#ecfdf5" stroke="#5eead4"/>
  <text x="80" y="472" font-size="11.5" font-weight="700" fill="#0f766e">JNI functions</text>
  <text x="80" y="492" font-size="10.5" font-family="Consolas, monospace" fill="#475569">connectStats(path)</text>
  <text x="80" y="510" font-size="10.5" font-family="Consolas, monospace" fill="#475569">listCounters(pattern)</text>
  <text x="80" y="528" font-size="10.5" font-family="Consolas, monospace" fill="#475569">getSimpleCounter(name)</text>
  <text x="80" y="546" font-size="10.5" font-family="Consolas, monospace" fill="#475569">dumpCombinedCounter(name)</text>

  <!-- RIGHT: binary API -->
  <rect x="550" y="80" width="490" height="500" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
  <text x="795" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#be123c">Binary API — the COMMAND path</text>
  <text x="795" y="130" text-anchor="middle" font-size="11" fill="#e11d48">tell VPP to DO something</text>

  <rect x="574" y="150" width="442" height="86" rx="8" fill="#ffffff" stroke="#fda4af"/>
  <text x="590" y="172" font-size="11.5" font-weight="700" fill="#be123c">What it is</text>
  <text x="590" y="192" font-size="10.5" fill="#475569">A message socket for request/reply commands. Used</text>
  <text x="590" y="209" font-size="10.5" fill="#475569">here to CLEAR counters — an action, not a read.</text>
  <text x="590" y="226" font-size="10.5" fill="#475569">Messages are matched by a CRC-versioned name.</text>

  <rect x="574" y="248" width="442" height="312" rx="8" fill="#ffffff" stroke="#fda4af"/>
  <text x="590" y="270" font-size="11.5" font-weight="700" fill="#be123c">clearAllCounters — the async round trip</text>
  <g font-size="10.5" fill="#475569">
    <text x="590" y="294">1 · vac_connect() to the API socket</text>
    <text x="590" y="316">2 · resolve msg id by CRC</text>
    <text x="606" y="332" font-size="9.5" fill="#9f1239">(ngfw_counter_clear — the message from Module 03)</text>
    <text x="590" y="354">3 · vac_write() the request (with a context id)</text>
    <text x="590" y="376">4 · VPP handler clears counters, sends a reply</text>
    <text x="590" y="398">5 · reply arrives on a callback thread</text>
    <text x="606" y="414" font-size="9.5" fill="#9f1239">match on context id → signal a condition var</text>
    <text x="590" y="436">6 · caller was waiting (cond var, 5s timeout)</text>
    <text x="606" y="452" font-size="9.5" fill="#9f1239">wakes, reads retval, returns to Java</text>
  </g>
  <rect x="590" y="470" width="410" height="76" rx="7" fill="#fef2f2" stroke="#fecaca"/>
  <text x="600" y="490" font-size="10.5" font-weight="700" fill="#b91c1c">Why the ceremony?</text>
  <text x="600" y="508" font-size="10" fill="#7f1d1d">Binary API replies are asynchronous — they come back on</text>
  <text x="600" y="524" font-size="10" fill="#7f1d1d">a different thread. The context id + condition variable turn</text>
  <text x="600" y="540" font-size="10" fill="#7f1d1d">that into a simple blocking call for the Java side.</text>

  <text x="540" y="600" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Rule of thumb: reads → stats segment (cheap, passive) · actions → binary API (request/reply).</text>
</svg>
