-size="13" lengthAdjust="spacingAndGlyphs" textLength="63" x="14" y="861.9028">Key point:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="176" x="14" y="877.0356">NAS is logically UE&lt;-&gt;AMF,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="236" x="14" y="892.1685">but physically it passes through gNB.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="0" x="18" y="907.3013"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="243" x="14" y="922.4341">gNB does NOT process NAS contents;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="167" x="14" y="937.5669">it forwards it like a courier.</text><!--MD5=[ed6bd83c8e1003249fb11bf9ceff1da1]
@startuml 5G_AS_vs_NAS
title 5G Signaling: Access Stratum (AS) vs Non-Access Stratum (NAS)

actor UE
participant "gNB\n(5G Base Station)" as gNB
participant "AMF\n(Core Control Plane)" as AMF

== Access Stratum (AS) - Radio Control ==
UE -> gNB: RRC Setup Request
gNB -> UE: RRC Setup
UE -> gNB: RRC Setup Complete

note right of gNB
AS = UE <-> gNB
Radio Access Control
Examples: RRC, PDCP, RLC, MAC
end note

== NAS messages are carried inside AS ==
UE -> gNB: NAS: Registration Request\n(encapsulated inside RRC/N2 transport)
gNB -> AMF: Forward NAS via N2\n(Initial UE Message)

note right of AMF
NAS = UE <-> AMF
Core Control Messaging
Examples:
- Registration
- Authentication (5G-AKA)
- NAS Security Mode
- Mobility updates
end note

== NAS Authentication Example ==
AMF -> gNB: NAS: Authentication Request
gNB -> UE: NAS: Authentication Request

UE -> gNB: NAS: Authentication Response
gNB -> AMF: NAS: Authentication Response

== After Security Mode ==
AMF -> UE: NAS Security Mode Command\n(Integrity + Cipher)
UE -> AMF: NAS Security Mode Complete

note bottom
Key point:
NAS is logically UE<->AMF,
but physically it passes through gNB.

gNB does NOT process NAS contents;
it forwards it like a courier.
end note
@enduml

