name: Render PlantUML to SVG

on:
  push:
    branches: ["master"]
    paths:
      - "**/*.puml"
      - ".github/workflows/plantuml-render.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java (required for PlantUML)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download PlantUML (latest release)
        run: |
          set -euo pipefail
          BASE="https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml"
          VER="$(curl -fsSL "$BASE/maven-metadata.xml" | grep -oP '(?<=<release>)[^<]+')"
          echo "PlantUML version: $VER"
          curl -fsSL -o plantuml.jar "$BASE/$VER/plantuml-$VER.jar"
          java -jar plantuml.jar -version

      - name: Render all .puml files to SVG
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p assets/diagrams
          tmp="$(mktemp -d)"
          failed=0
          # Render each file to a temp dir first; only copy into place on success,
          # so a .puml with a syntax error never overwrites a good committed SVG.
          while IFS= read -r file; do
            rel_path="${file#./}"
            out_dir="assets/diagrams/$(dirname "$rel_path")"
            mkdir -p "$out_dir"
            rm -f "$tmp"/*.svg
            echo "Rendering: $rel_path"
            if java -jar plantuml.jar -tsvg "$rel_path" -o "$tmp"; then
              cp "$tmp"/*.svg "$out_dir"/ 2>/dev/null || true
            else
              echo "::warning file=$rel_path::PlantUML failed to render (existing SVG kept)"
              failed=$((failed + 1))
            fi
          done < <(find . -type f -name "*.puml" -print)
          rm -rf "$tmp"
          echo "Rendering complete with $failed failure(s); existing SVGs kept for any that failed."

      - name: Commit rendered SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/diagrams

          if git diff --cached --quiet; then
            echo "No rendered SVG changes to commit."
            exit 0
          fi

          git commit -m "Auto-render PlantUML diagrams (SVG)"
          git push
