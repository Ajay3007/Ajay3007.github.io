<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="359px" preserveAspectRatio="none" style="width:1121px;height:359px;" version="1.1" viewBox="0 0 1121 359" width="1121px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="224" x="457.5" y="16.708">Two Ways to Talk to VPP</text><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="451" x="344" y="37.6611">(reads vs commands use different client interfaces)</text><!--entity READ--><rect fill="#F0FDFA" height="206.8203" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="560" x="6" y="78.4063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="241" x="16" y="101.4014">STATS SEGMENT — the READ path</text><line style="stroke: #000000; stroke-width: 1.0;" x1="7" x2="165" y1="112.8516" y2="112.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="7" x2="165" y1="114.8516" y2="114.8516"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="242" x="165" y="117.1982">get counters cheaply, continuously</text><line style="stroke: #000000; stroke-width: 1.0;" x1="407" x2="565" y1="112.8516" y2="112.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="407" x2="565" y1="114.8516" y2="114.8516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="7" x2="565" y1="129.1484" y2="129.1484"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="416" x="22" y="146.1436">What: a shared-memory region VPP publishes counters into;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="450" x="22" y="162.4404">readers map it and read directly (no request, no hot-path impact).</text><line style="stroke: #000000; stroke-width: 1.0;" x1="7" x2="565" y1="169.7422" y2="169.7422"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="427" x="22" y="186.7373">The catch: each worker thread has its OWN copy of a counter,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="227" x="22" y="203.0342">so a total = sum across workers:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="290" x="22" y="219.3311">for w in workers: total += counter[w][rule]</text><line style="stroke: #000000; stroke-width: 1.0;" x1="7" x2="565" y1="226.6328" y2="226.6328"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="521" x="22" y="243.6279">Counter kinds: simple/scalar (one number) · combined (packets AND bytes)</text><line style="stroke: #000000; stroke-width: 1.0;" x1="7" x2="565" y1="250.9297" y2="250.9297"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="528" x="22" y="267.9248">JNI: connectStats · listCounters · getSimpleCounter · dumpCombinedCounter</text><!--entity CMD--><rect fill="#FFF1F2" height="264.0078" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="519" x="601.5" y="49.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="235" x="611.5" y="72.9014">BINARY API — the COMMAND path</text><line style="stroke: #000000; stroke-width: 1.0;" x1="602.5" x2="774.5" y1="84.3516" y2="84.3516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="602.5" x2="774.5" y1="86.3516" y2="86.3516"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="173" x="774.5" y="88.6982">tell VPP to DO something</text><line style="stroke: #000000; stroke-width: 1.0;" x1="947.5" x2="1119.5" y1="84.3516" y2="84.3516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="947.5" x2="1119.5" y1="86.3516" y2="86.3516"/><line style="stroke: #000000; stroke-width: 1.0;" x1="602.5" x2="1119.5" y1="100.6484" y2="100.6484"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="445" x="617.5" y="117.6436">What: a request/reply message socket; messages matched by a</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="440" x="617.5" y="133.9404">CRC-versioned name. Used here to CLEAR counters (an action).</text><line style="stroke: #000000; stroke-width: 1.0;" x1="602.5" x2="1119.5" y1="141.2422" y2="141.2422"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="188" x="617.5" y="158.2373">clearAllCounters round trip:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="235" x="617.5" y="174.5342">1. vac_connect() to the API socket</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="435" x="617.5" y="190.8311">2. resolve msg id by CRC (ngfw_counter_clear, from Module 03)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="301" x="617.5" y="207.1279">3. vac_write() the request (with a context id)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="311" x="617.5" y="223.4248">4. VPP handler clears counters, sends a reply</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="392" x="617.5" y="239.7217">5. reply arrives on a callback thread (match on context id)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="425" x="617.5" y="256.0186">6. caller waiting on a condition var (5s timeout) wakes, returns</text><line style="stroke: #000000; stroke-width: 1.0;" x1="602.5" x2="1119.5" y1="263.3203" y2="263.3203"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="487" x="617.5" y="280.3154">Why the ceremony: replies are async on another thread; the context id</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="415" x="617.5" y="296.6123">+ condition variable turn it into a simple blocking call for Java.</text><rect fill="#DDDDDD" height="26.2969" rx="5" ry="5" style="stroke: #000000; stroke-width: 1.0;" width="662" x="238" y="331.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="650" x="244" y="349.9014">Rule of thumb: reads -&gt; stats segment (cheap, passive) · actions -&gt; binary API (request/reply).</text></g></svg>