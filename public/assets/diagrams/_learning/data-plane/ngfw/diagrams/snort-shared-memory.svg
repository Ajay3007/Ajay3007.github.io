<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="565px" preserveAspectRatio="none" style="width:1438px;height:565px;" version="1.1" viewBox="0 0 1438 565" width="1438px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="326" x="565" y="16.708">VPP &lt;-&gt; Snort over Shared Memory</text><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="582" x="437" y="37.6611">(per-thread queue pair; packet bytes stay in a shared buffer pool)</text><!--cluster SHARED MEMORY (mmap'd by both)--><polygon fill="#FFFFFF" points="22,197.9063,305,197.9063,312,220.2031,1122,220.2031,1122,487.9063,22,487.9063,22,197.9063" style="stroke: #000000; stroke-width: 2.0;"/><line style="stroke: #000000; stroke-width: 2.0;" x1="22" x2="312" y1="220.2031" y2="220.2031"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="277" x="26" y="212.9014">SHARED MEMORY (mmap'd by both)</text><!--entity POOL--><rect fill="#EEF2FF" height="52.5938" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="410" x="39" y="418.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="258" x="49" y="441.9014">Buffer pool — the actual packet bytes</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="390" x="49" y="458.1982">[pkt0][pkt1][pkt2]...  (referenced by offset, never copied)</text><!--entity ENQ--><rect fill="#F0FDFA" height="52.5938" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="298" x="485" y="248.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="114" x="495" y="271.9014">Enqueue ring -&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="278" x="495" y="288.1982">VPP writes packet descriptors (head/tail)</text><!--entity DESC--><rect fill="#FFFBEB" height="85.1875" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="412" x="38" y="232.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="142" x="48" y="255.9014">Descriptor (one slot)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="273" x="48" y="272.1982">{ offset -&gt; buffer pool, length, pool_id }</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="293" x="48" y="288.4951">metadata union: in -&gt; flags/flow_id/ingress</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="392" x="48" y="304.792">metadata union: out -&gt; verdict + appid + sid_entries[10]</text><!--entity DEQ--><rect fill="#FFF1F2" height="52.5938" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="289" x="817.5" y="248.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="116" x="827.5" y="271.9014">&lt;- Dequeue ring</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="269" x="827.5" y="288.1982">Snort writes the verdict back (head/tail)</text><!--entity VPP--><rect fill="#F0FDFA" height="85.1875" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="209" x="693.5" y="49.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="127" x="703.5" y="72.9014">VPP worker thread</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="152" x="703.5" y="89.1982">(snort-ip4-input node)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="189" x="703.5" y="105.4951">[enqueue: write descriptor]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="163" x="703.5" y="121.792">[dequeue: read verdict]</text><!--entity SNORT--><rect fill="#FFF1F2" height="101.4844" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="299" x="1138.5" y="394.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="100" x="1148.5" y="417.9014">Snort instance</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="213" x="1148.5" y="434.1982">(separate process + VPP DAQ)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="222" x="1148.5" y="450.4951">[read descriptor -&gt; follow offset]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="118" x="1148.5" y="466.792">[inspect vs rules]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="279" x="1148.5" y="483.0889">[write verdict: PASS/BLOCK + SID/AppID]</text><path d="M760.38,134.9362 C729.97,168.4962 687.91,214.9163 660.82,244.8062 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="657.27,248.7263,666.28,244.7488,660.6298,245.0233,660.3553,239.3731,657.27,248.7263" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="50" x="731" y="177.9731">packets</text><path d="M735.35,301.9163 C756.69,307.2463 779.08,312.7863 800,317.9063 C942.93,352.8663 979.89,356.7563 1122,394.9063 C1125.78,395.9163 1129.6,396.9563 1133.45,398.0163 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="1138.35,399.3663,1130.7556,393.0952,1133.5338,398.0229,1128.6062,400.8011,1138.35,399.3663" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="29" x="1000" y="360.9731">read</text><path d="M1191.66,394.7563 C1134.34,365.2163 1063.73,328.8262 1016.05,304.2663 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="1011.51,301.9263,1017.6831,309.6004,1015.9561,304.2136,1021.3429,302.4867,1011.51,301.9263" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="77" x="1126" y="360.9731">write verdict</text><path d="M839.02,138.6762 C870.51,173.4262 912.84,220.1463 938.73,248.7263 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="835.62,134.9362,838.7053,144.2894,838.9798,138.6392,844.63,138.9137,835.62,134.9362" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="76" x="876" y="177.9731">read verdict</text><path d="M244,317.9363 C244,347.4462 244,386.4563 244,413.3063 " fill="none" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#A80036" points="244,418.5063,248,409.5063,244,413.5063,240,409.5063,244,418.5063" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="112" x="245" y="360.9731">offset (zero copy)</text><rect fill="#DDDDDD" height="42.5938" rx="5" ry="5" style="stroke: #000000; stroke-width: 1.0;" width="531" x="462" y="521.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="519" x="468" y="539.9014">Rings are lock-free SPSC; head/tail indices are the only cross-process sync.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="443" x="468" y="556.1982">Signal: poll the ring, or wake via deq_fd eventfd (interrupt mode).</text></g></svg>