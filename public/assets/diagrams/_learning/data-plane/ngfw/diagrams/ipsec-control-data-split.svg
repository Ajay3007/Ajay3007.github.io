<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="566px" preserveAspectRatio="none" style="width:1020px;height:566px;" version="1.1" viewBox="0 0 1020 566" width="1020px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="483" x="285" y="16.708">IPsec: Negotiate Once (control), Encrypt Always (data)</text><!--cluster CONTROL PLANE — occasional negotiation--><polygon fill="#FFFFFF" points="30,410.9531,367,410.9531,374,433.25,1019,433.25,1019,565.9531,30,565.9531,30,410.9531" style="stroke: #000000; stroke-width: 2.0;"/><line style="stroke: #000000; stroke-width: 2.0;" x1="30" x2="374" y1="433.25" y2="433.25"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="331" x="34" y="425.9482">CONTROL PLANE — occasional negotiation</text><!--cluster DATA PLANE — per-packet encryption--><polygon fill="#FFFFFF" points="22,44.9531,326,44.9531,333,67.25,398,67.25,398,361.9531,22,361.9531,22,44.9531" style="stroke: #000000; stroke-width: 2.0;"/><line style="stroke: #000000; stroke-width: 2.0;" x1="22" x2="333" y1="67.25" y2="67.25"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="298" x="26" y="59.9482">DATA PLANE — per-packet encryption</text><!--entity CLIENTS--><rect fill="#FFF7ED" height="85.1875" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="324" x="225" y="464.9531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="166" x="235" y="487.9482">VICI clients (automation)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="291" x="235" y="504.2451">create_ipsec.py (load_conn / PSK / initiate)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="286" x="235" y="520.542">swanctl_bridge.py (list / rekey / terminate)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="304" x="235" y="536.8389">VPP CLI -&gt; popen python3 (ngfw_swanctl ...)</text><!--entity CHARON--><rect fill="#FFEDD5" height="85.1875" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="296" x="707" y="464.9531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="135" x="717" y="487.9482">StrongSwan charon</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="109" x="717" y="504.2451">the IKE daemon</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="276" x="717" y="520.542">IKEv2: authenticate peer, agree ciphers,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="160" x="717" y="536.8389">derive ESP keys -&gt; SAs</text><!--entity PEER--><rect fill="#F1F5F9" height="36.2969" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="143" x="46.5" y="489.4531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="123" x="56.5" y="512.4482">Remote VPN peer</text><!--entity BRIDGE--><rect fill="#FFF1F2" height="85.1875" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="328" x="50" y="98.9531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="204" x="60" y="121.9482">kernel-vpp plugin (the bridge)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="308" x="60" y="138.2451">replaces StrongSwan's Linux-kernel backend</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="268" x="60" y="154.542">installs each SA into VPP, auto-binds to</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="245" x="60" y="170.8389">the tunnel iface, refreshes on rekey</text><!--entity VPP--><rect fill="#F0FDFA" height="85.1875" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="344" x="38" y="260.9531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="103" x="48" y="283.9482">VPP data plane</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="179" x="48" y="300.2451">esp-encrypt / esp-decrypt</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="324" x="48" y="316.542">SA table (keys + SPIs) indexed by out_sa_index</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="175" x="48" y="332.8389">bound to tunnel interface</text><path d="M549.04,507.4531 C598.58,507.4531 652.88,507.4531 701.81,507.4531 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="706.83,507.4531,697.83,503.4531,701.83,507.4531,697.83,511.4531,706.83,507.4531" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="70" x="593" y="485.52">VICI socket</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="121" x="567.5" y="500.6528">/var/run/charon.vici</text><path d="M757.31,462.8231 C702.6,440.2831 632.42,415.3531 567,403.9531 C488.41,390.2631 280.6,370.8731 208,403.9531 C171.69,420.4931 144.35,459.7331 129.8,484.8531 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="127.23,489.3731,135.1579,483.5294,129.703,485.0275,128.2049,479.5726,127.23,489.3731" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="762.22,464.8631,755.4398,457.7197,757.6017,462.9472,752.3742,465.1091,762.22,464.8631" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="125" x="295.5" y="391.02">IKE (UDP 500/4500)</text><path d="M781.75,464.8631 C659.83,395.6231 416.36,257.3631 291.61,186.5231 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="287.22,184.0331,293.0637,191.961,291.5656,186.5061,297.0205,185.008,287.22,184.0331" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M212.96,184.0731 C212.41,206.0231 211.74,233.0231 211.17,255.6931 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="211.04,260.7631,215.27,251.8689,211.1685,255.7648,207.2727,251.6633,211.04,260.7631" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="59" x="213" y="227.02">install SA</text><path d="M160.82,345.9631 C151.98,355.6131 143.76,366.4531 138,377.9531 C120.83,412.2031 117.63,457.5031 117.43,484.1631 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="117.43,489.2331,121.43,480.2331,117.43,484.2331,113.43,480.2331,117.43,489.2331" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="147" x="139" y="391.02">encrypted ESP packets</text></g></svg>