<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="613px" preserveAspectRatio="none" style="width:512px;height:613px;" version="1.1" viewBox="0 0 512 613" width="512px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="157" x="183" y="26.708">Startup Sequence</text><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="499" x="12" y="47.6611">(orchestrator brings the planes up in dependency order)</text><ellipse cx="236.5" cy="61.9063" fill="#000000" rx="10" ry="10" style="stroke: none; stroke-width: 1.0;"/><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="397" x="38" y="91.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="202" x="48" y="113.0449">1. Render config from templates</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="377" x="48" y="127.0137">(envsubst fills env-file values into startup + interface config)</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="393" x="40" y="159.8438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="171" x="50" y="180.9824">2. Launch VPP (data plane)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="373" x="50" y="194.9512">binds NICs via DPDK, starts worker threads on pinned cores</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="403" x="35" y="227.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="151" x="45" y="248.9199">3. Apply interface config</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="383" x="45" y="262.8887">VLAN sub-ifaces, IPs, feature arcs, NAT enable — the pipeline</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="421" x="26" y="295.7188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="173" x="36" y="316.8574">4. Start Snort IPS instances</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="401" x="36" y="330.8262">N processes pinned to cores; each attaches to VPP via the DAQ</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="348" x="62.5" y="363.6563"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="182" x="72.5" y="384.7949">5. Start IKE daemon (control)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="328" x="72.5" y="398.7637">StrongSwan charon, ready to negotiate VPN tunnels</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="450" x="11.5" y="431.5938"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="178" x="21.5" y="452.7324">6. Start management bridge</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="430" x="21.5" y="466.7012">Java process attaches to VPP stats/API; serves counters northbound</text><rect fill="#FEFECE" height="47.9375" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="411" x="31" y="499.5313"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="196" x="41" y="520.6699">7. Seed management ACL rules</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="391" x="41" y="534.6387">baseline permit rules so the box is reachable for management</text><polygon fill="#FBFB77" points="266.5,557.4688,266.5,612.8672,501.5,612.8672,501.5,567.4688,491.5,557.4688,266.5,557.4688" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#FBFB77" points="266.5,557.4688,266.5,581.168,246.5,585.168,266.5,589.168,266.5,612.8672,501.5,612.8672,501.5,567.4688,491.5,557.4688,266.5,557.4688" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="491.5" x2="491.5" y1="557.4688" y2="567.4688"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="501.5" x2="491.5" y1="567.4688" y2="567.4688"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="214" x="272.5" y="574.5356">Data plane first, then the engines</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="186" x="272.5" y="589.6685">that plug into it, then control,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="124" x="272.5" y="604.8013">then management.</text><ellipse cx="236.5" cy="585.168" fill="none" rx="10" ry="10" style="stroke: #000000; stroke-width: 1.0;"/><ellipse cx="237" cy="585.668" fill="#000000" rx="6" ry="6" style="stroke: none; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="236.5" x2="236.5" y1="71.9063" y2="91.9063"/><polygon fill="#A80036" points="232.5,81.9063,236.5,91.9063,240.5,81.9063,236.5,85.9063" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="236.5" x2="236.5" y1="139.8438" y2="159.8438"/><polygon fill="#A80036" points="232.5,149.8438,236.5,159.8438,240.5,149.8438,236.5,153.8438" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="236.5" x2="236.5" y1="207.7813" y2="227.7813"/><polygon fill="#A80036" points="232.5,217.7813,236.5,227.7813,240.5,217.7813,236.5,221.7813" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="236.5" x2="236.5" y1="275.7188" y2="295.7188"/><polygon fill="#A80036" points="232.5,285.7188,236.5,295.7188,240.5,285.7188,236.5,289.7188" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="236.5" x2="236.5" y1="343.6563" y2="363.6563"/><polygon fill="#A80036" points="232.5,353.6563,236.5,363.6563,240.5,353.6563,236.5,357.6563" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="236.5" x2="236.5" y1="411.5938" y2="431.5938"/><polygon fill="#A80036" points="232.5,421.5938,236.5,431.5938,240.5,421.5938,236.5,425.5938" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="236.5" x2="236.5" y1="479.5313" y2="499.5313"/><polygon fill="#A80036" points="232.5,489.5313,236.5,499.5313,240.5,489.5313,236.5,493.5313" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="236.5" x2="236.5" y1="547.4688" y2="575.168"/><polygon fill="#A80036" points="232.5,565.168,236.5,575.168,240.5,565.168,236.5,569.168" style="stroke: #A80036; stroke-width: 1.0;"/></g></svg>