<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="535px" preserveAspectRatio="none" style="width:616px;height:535px;" version="1.1" viewBox="0 0 616 535" width="616px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="284" x="170" y="16.708">Why "Vector" Packet Processing</text><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacingAndGlyphs" textLength="366" x="129" y="37.6611">(a node processes a whole batch at once)</text><!--cluster One VPP node function--><polygon fill="#FFFFFF" points="138,143.9063,327,143.9063,334,166.2031,472,166.2031,472,376.9063,138,376.9063,138,143.9063" style="stroke: #000000; stroke-width: 2.0;"/><line style="stroke: #000000; stroke-width: 2.0;" x1="138" x2="334" y1="166.2031" y2="166.2031"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="183" x="142" y="158.9014">One VPP node function</text><!--entity DUAL--><rect fill="#FFFFFF" height="68.8906" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="302" x="154" y="178.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="218" x="164" y="201.9014">Dual loop — 2 packets at a time</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="264" x="164" y="218.1982">prefetch next buffers while processing</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="282" x="164" y="234.4951">the current pair -&gt; hides memory latency</text><!--entity SINGLE--><rect fill="#FFFFFF" height="52.5938" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="270" x="170" y="307.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="208" x="180" y="330.9014">Single loop — leftover packets</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="250" x="180" y="347.1982">handles the remainder one at a time</text><!--entity IN--><rect fill="#EFF6FF" height="68.8906" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="215" x="197.5" y="49.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="147" x="207.5" y="72.9014">Input frame (a vector)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="195" x="207.5" y="89.1982">[pkt0][pkt1][pkt2]...[pkt N-1]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="171" x="207.5" y="105.4951">up to 256 packet indices</text><!--entity O1--><rect fill="#ECFDF5" height="52.5938" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="158" x="42" y="420.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="123" x="52" y="443.9014">-&gt; snort-ip4-input</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="138" x="52" y="460.1982">(packets to inspect)</text><!--entity O2--><rect fill="#EFF6FF" height="52.5938" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="140" x="235" y="420.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="94" x="245" y="443.9014">-&gt; ip4-lookup</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="120" x="245" y="460.1982">(passed packets)</text><!--entity O3--><rect fill="#FFF7ED" height="52.5938" rx="4" ry="4" style="stroke: #000000; stroke-width: 1.5;" width="159" x="410.5" y="420.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="113" x="420.5" y="443.9014">-&gt; esp4-encrypt</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="139" x="420.5" y="460.1982">(packets to encrypt)</text><path d="M305,119.1062 C305,135.7563 305,155.9362 305,173.2663 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="305,178.5463,309,169.5463,305,173.5463,301,169.5463,305,178.5463" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M305,248.1863 C305,265.3763 305,286.1063 305,302.8162 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="305,307.8663,309,298.8663,305,302.8663,301,298.8663,305,307.8663" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M262.32,361.1463 C234.11,378.1763 197.1,400.4963 168.04,418.0263 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="163.44,420.7963,173.2125,419.5718,167.7212,418.2133,169.0797,412.722,163.44,420.7963" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M305,361.1463 C305,377.4063 305,398.4863 305,415.6163 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="305,420.7963,309.0257,411.8077,305.0143,415.7963,301.0257,411.7849,305,420.7963" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M347.91,361.1463 C376.28,378.1763 413.48,400.4963 442.71,418.0263 " fill="none" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="447.32,420.7963,441.6605,412.7358,443.0325,418.2238,437.5446,419.5958,447.32,420.7963" style="stroke: #A80036; stroke-width: 1.0;"/><rect fill="#DDDDDD" height="42.5938" rx="5" ry="5" style="stroke: #000000; stroke-width: 1.0;" width="607" x="8" y="491.9063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="586" x="14" y="509.9014">Processing a batch keeps the node's code and data hot in CPU cache, so per-packet</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="595" x="14" y="526.1982">overhead is amortized to a few nanoseconds. This is why VPP hits line rate in software.</text></g></svg>