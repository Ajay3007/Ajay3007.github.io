<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="800" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1f36">One Packet's Journey — inspected flow going out over VPN</text>
  <text x="470" y="57" text-anchor="middle" font-size="12.5" fill="#64748b">Left: the graph nodes it visits. Right: how the per-packet note in opaque2 evolves.</text>

  <text x="255" y="80" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Graph nodes (in order)</text>
  <text x="740" y="80" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Packet buffer note (opaque2)</text>

  <!-- steps -->
  <g font-size="12.5">
    <!-- 0 -->
    <rect x="40" y="90" width="430" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <circle cx="70" cy="119" r="14" fill="#334155"/><text x="70" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">0</text>
    <text x="94" y="114" font-size="12.5" font-weight="700" fill="#1a1f36">Ingress — inbound VLAN sub-interface</text>
    <text x="94" y="134" font-size="10.5" fill="#64748b">packet arrives; 5-tuple (src:port → dst:port, proto)</text>
    <!-- 1 -->
    <rect x="40" y="162" width="430" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <circle cx="70" cy="191" r="14" fill="#334155"/><text x="70" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="94" y="186" font-size="12.5" font-weight="700" fill="#1a1f36">ip4-input</text>
    <text x="94" y="206" font-size="10.5" fill="#64748b">parse + validate header, checksum, TTL</text>
    <!-- 2 -->
    <rect x="40" y="234" width="430" height="58" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="70" cy="263" r="14" fill="#0f766e"/><text x="70" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="94" y="258" font-size="12.5" font-weight="700" fill="#0f766e">acl-plugin</text>
    <text x="94" y="278" font-size="10.5" fill="#64748b">rule match → steering tag = SNORT_NAT_IPSEC</text>
    <!-- 3 -->
    <rect x="40" y="306" width="430" height="58" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <circle cx="70" cy="335" r="14" fill="#0f766e"/><text x="70" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="94" y="330" font-size="12.5" font-weight="700" fill="#0f766e">ngfw-decision</text>
    <text x="94" y="350" font-size="10.5" fill="#64748b">action = snort-then-nat-then-ipsec; write note; continue arc</text>
    <!-- 4 -->
    <rect x="40" y="378" width="430" height="58" rx="8" fill="#fff1f2" stroke="#fda4af"/>
    <circle cx="70" cy="407" r="14" fill="#be123c"/><text x="70" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <text x="94" y="402" font-size="12.5" font-weight="700" fill="#be123c">snort-ip4-input</text>
    <text x="94" y="422" font-size="10.5" fill="#64748b">deep inspection → verdict PASS  (a DROP never returns)</text>
    <!-- 5 -->
    <rect x="40" y="450" width="430" height="58" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <circle cx="70" cy="479" r="14" fill="#0f766e"/><text x="70" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
    <text x="94" y="474" font-size="12.5" font-weight="700" fill="#0f766e">ngfw-post-snort</text>
    <text x="94" y="494" font-size="10.5" fill="#64748b">cookie 0xAB valid → post_action = NAT</text>
    <!-- 6 -->
    <rect x="40" y="522" width="430" height="58" rx="8" fill="#ffffff" stroke="#5eead4"/>
    <circle cx="70" cy="551" r="14" fill="#0f766e"/><text x="70" y="556" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
    <text x="94" y="546" font-size="12.5" font-weight="700" fill="#0f766e">nat44</text>
    <text x="94" y="566" font-size="10.5" fill="#64748b">translate source addr/port; open a session (flow state)</text>
    <!-- 7 -->
    <rect x="40" y="594" width="430" height="58" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="70" cy="623" r="14" fill="#c2410c"/><text x="70" y="628" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text>
    <text x="94" y="618" font-size="12.5" font-weight="700" fill="#9a3412">esp4-encrypt</text>
    <text x="94" y="638" font-size="10.5" fill="#64748b">encrypt with the outbound IPsec SA</text>
    <!-- 8 -->
    <rect x="40" y="666" width="430" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <circle cx="70" cy="695" r="14" fill="#334155"/><text x="70" y="700" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text>
    <text x="94" y="690" font-size="12.5" font-weight="700" fill="#1a1f36">Egress — VPN-out VLAN sub-interface</text>
    <text x="94" y="710" font-size="10.5" fill="#64748b">encrypted packet leaves toward the tunnel peer</text>
  </g>

  <!-- connectors -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="70" y1="148" x2="70" y2="162"/>
    <line x1="70" y1="220" x2="70" y2="234"/>
    <line x1="70" y1="292" x2="70" y2="306"/>
    <line x1="70" y1="364" x2="70" y2="378"/>
    <line x1="70" y1="436" x2="70" y2="450"/>
    <line x1="70" y1="508" x2="70" y2="522"/>
    <line x1="70" y1="580" x2="70" y2="594"/>
    <line x1="70" y1="652" x2="70" y2="666"/>
  </g>

  <!-- opaque2 note chips -->
  <g font-size="10.5">
    <!-- after step 2 -->
    <rect x="560" y="238" width="356" height="50" rx="7" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="574" y="258" font-weight="700" fill="#0f766e">opaque2[0..3] = tag</text>
    <text x="574" y="276" fill="#475569">ACL writes SNORT_NAT_IPSEC into the first 4 bytes</text>
    <!-- after step 3 -->
    <rect x="560" y="310" width="356" height="50" rx="7" fill="#ecfdf5" stroke="#5eead4"/>
    <text x="574" y="330" font-weight="700" fill="#0f766e">note = { cookie 0xAB, post=NAT, sa=# }</text>
    <text x="574" y="348" fill="#475569">decision stamps the note the post-Snort node will read</text>
    <!-- after step 5 -->
    <rect x="560" y="454" width="356" height="50" rx="7" fill="#ecfdf5" stroke="#5eead4"/>
    <text x="574" y="474" font-weight="700" fill="#0f766e">read note → NAT; cookie consumed (=0)</text>
    <text x="574" y="492" fill="#475569">prevents any accidental re-processing</text>
    <!-- after step 7 -->
    <rect x="560" y="598" width="356" height="50" rx="7" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="574" y="618" font-weight="700" fill="#9a3412">buffer.ipsec.sad_index = SA</text>
    <text x="574" y="636" fill="#475569">tells esp4-encrypt which keys to use</text>
  </g>

  <!-- dashed guide lines from steps to chips -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="470" y1="263" x2="560" y2="263"/>
    <line x1="470" y1="335" x2="560" y2="335"/>
    <line x1="470" y1="479" x2="560" y2="479"/>
    <line x1="470" y1="623" x2="560" y2="623"/>
  </g>

  <rect x="560" y="666" width="356" height="58" rx="7" fill="#fef2f2" stroke="#fecaca"/>
  <text x="574" y="686" font-size="10.5" font-weight="700" fill="#b91c1c">Drop paths (not shown above):</text>
  <text x="574" y="703" font-size="10" fill="#7f1d1d">policy DROP → error-drop at step 3</text>
  <text x="574" y="718" font-size="10" fill="#7f1d1d">Snort DROP verdict → error-drop (never reaches step 5)</text>
</svg>
