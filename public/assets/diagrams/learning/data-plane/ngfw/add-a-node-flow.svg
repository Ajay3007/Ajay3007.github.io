<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="680" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1f36">Adding a Feature Node — the Contribution Loop</text>
  <text x="470" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">The shape of a typical data-plane change: write, register, wire, build, and watch it work.</text>

  <g font-size="12.5">
    <!-- steps with a right-hand "file touched" badge -->
    <!-- 1 -->
    <rect x="50" y="80" width="600" height="58" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="80" cy="109" r="15" fill="#0f766e"/><text x="80" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="108" y="104" font-weight="700" fill="#0f766e">Write the node function</text>
    <text x="108" y="124" font-size="10.5" fill="#64748b">dual/single loop; per-packet decide() returns a next-node index</text>
    <rect x="670" y="90" width="220" height="38" rx="6" fill="#ecfdf5" stroke="#5eead4"/>
    <text x="780" y="114" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#0f766e">my_feature.c</text>
    <!-- 2 -->
    <rect x="50" y="150" width="600" height="58" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="80" cy="179" r="15" fill="#0f766e"/><text x="80" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="108" y="174" font-weight="700" fill="#0f766e">Register the node + next-node table</text>
    <text x="108" y="194" font-size="10.5" fill="#64748b">VLIB_REGISTER_NODE with next_nodes[], error strings, trace format</text>
    <rect x="670" y="160" width="220" height="38" rx="6" fill="#ecfdf5" stroke="#5eead4"/>
    <text x="780" y="184" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#0f766e">my_feature.c</text>
    <!-- 3 -->
    <rect x="50" y="220" width="600" height="58" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="80" cy="249" r="15" fill="#0f766e"/><text x="80" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="108" y="244" font-weight="700" fill="#0f766e">Register on the feature arc</text>
    <text x="108" y="264" font-size="10.5" fill="#64748b">VNET_FEATURE_INIT with runs_after / runs_before (place it precisely)</text>
    <rect x="670" y="230" width="220" height="38" rx="6" fill="#ecfdf5" stroke="#5eead4"/>
    <text x="780" y="254" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#0f766e">my_feature.c</text>
    <!-- 4 -->
    <rect x="50" y="290" width="600" height="58" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <circle cx="80" cy="319" r="15" fill="#b45309"/><text x="80" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="108" y="314" font-weight="700" fill="#b45309">Coordinate via opaque2 (only if a later node needs it)</text>
    <text x="108" y="334" font-size="10.5" fill="#64748b">write a note + cookie before; read &amp; consume it downstream</text>
    <rect x="670" y="300" width="220" height="38" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="780" y="324" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#b45309">shared header .h</text>
    <!-- 5 -->
    <rect x="50" y="360" width="600" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="80" cy="389" r="15" fill="#1e40af"/><text x="80" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
    <text x="108" y="384" font-weight="700" fill="#1e40af">Add the source to the build</text>
    <text x="108" y="404" font-size="10.5" fill="#64748b">list my_feature.c under SOURCES in add_vpp_plugin(...)</text>
    <rect x="670" y="370" width="220" height="38" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="780" y="394" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#1e40af">CMakeLists.txt</text>
    <!-- 6 -->
    <rect x="50" y="430" width="600" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="80" cy="459" r="15" fill="#1e40af"/><text x="80" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
    <text x="108" y="454" font-weight="700" fill="#1e40af">Enable it per interface</text>
    <text x="108" y="474" font-size="10.5" fill="#64748b">add a "set interface feature ..." line to the startup config</text>
    <rect x="670" y="440" width="220" height="38" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="780" y="464" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#1e40af">*.template</text>
    <!-- 7 -->
    <rect x="50" y="500" width="600" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <circle cx="80" cy="529" r="15" fill="#6d28d9"/><text x="80" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text>
    <text x="108" y="524" font-weight="700" fill="#6d28d9">Build, reload, and VERIFY</text>
    <text x="108" y="544" font-size="10.5" fill="#64748b">make build-release → restart VPP → show trace / show node counters</text>
    <rect x="670" y="510" width="220" height="38" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="780" y="534" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#6d28d9">vppctl</text>
  </g>

  <!-- connectors -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="80" y1="138" x2="80" y2="150"/>
    <line x1="80" y1="208" x2="80" y2="220"/>
    <line x1="80" y1="278" x2="80" y2="290"/>
    <line x1="80" y1="348" x2="80" y2="360"/>
    <line x1="80" y1="418" x2="80" y2="430"/>
    <line x1="80" y1="488" x2="80" y2="500"/>
  </g>

  <text x="470" y="588" text-anchor="middle" font-size="11.5" fill="#334155">Steps 1–3 mirror the real ngfw-decision node. Step 4 is the opaque2 pattern. Steps 5–7 build and prove it.</text>
  <text x="470" y="612" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">Golden rule: never merge a data-plane change you haven't watched pass a real packet in `show trace`.</text>

  <rect x="150" y="630" width="640" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="470" y="652" text-anchor="middle" font-size="10.5" fill="#b91c1c">Watch the gotchas: opaque2 field offsets · per-worker counter aggregation · message CRCs after .api changes</text>
</svg>
