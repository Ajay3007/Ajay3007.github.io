problems:
# _data/problems.yml
# Single source of truth for ALL DSA problems.
# Generated from full codebase audit — February 2026.
#
# Schema:
#   id          : LeetCode number as string, or "gfg-<slug>" for GFG-only problems
#   title       : Problem title
#   platform    : leetcode | gfg
#   difficulty  : easy | medium | hard
#   topics      : list — used for filtering (arrays, strings, linked-list, stacks,
#                 tree, searching-sorting, sliding-window, two-pointers, dp, graphs)
#   solved      : true | false
#   problem_url : canonical link to the problem
#   approach_url: your approach/notes link (empty string if none)
#   solution_url: your solution link (empty string if none)
#
# Usage in Liquid:
#   All problems:  site.data.problems
#   Solved count:  site.data.problems | where: "solved", true | size
#   By topic:      site.data.problems | where_exp: "p", "p.topics contains 'arrays'"
#   By difficulty: site.data.problems | where: "difficulty", "easy"

